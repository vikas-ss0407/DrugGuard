services:
  # Backend API Service
  - type: web
    name: drugguard-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    
    buildCommand: npm install
    startCommand: node server.js
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ORIGIN
        value: https://drugguard-frontend.onrender.com
    
    headers:
      - path: /api/*
        name: X-API-Version
        value: v1
    
    routes:
      - type: http
        path: /
        middleware: []
    
    autoDeploy: true
    
  # Frontend Static Site
  - type: static_site
    name: drugguard-frontend
    env: static
    region: oregon
    plan: free
    rootDir: DrugGuard
    
    buildCommand: npm install && npm run build
    publishDirectory: dist
    
    envVars:
      - key: VITE_API_BASE_URL
        value: https://drugguard-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    
    routes:
      - type: http
        path: /
        middleware: []
        destination: /index.html
      - type: http
        path: /*
        middleware: []
        destination: /index.html
    
    autoDeploy: true
